# NEXORA — CI, Blockchain Tests, and Security Analysis
name: NEXORA Testing and Security

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexora-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python and Blockchain Tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show Python version
        run: python --version

      - name: Compile Python source
        run: python -m compileall -q blockchain_core.py test_blockchain_core.py

      - name: Run NEXORA unit tests
        run: python -m unittest discover -s . -p "test*.py" -v

  security-scan:
    name: Python Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install bandit pip-audit

      - name: Scan NEXORA Python code with Bandit
        run: bandit -r blockchain_core.py test_blockchain_core.py -ll

      - name: Audit project dependencies
        shell: bash
        run: |
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
            pip-audit -r requirements.txt
          elif [ -f pyproject.toml ]; then
            pip-audit .
          else
            echo "No requirements.txt or pyproject.toml found."
            echo "NEXORA currently uses Python standard-library modules only."
            echo "Dependency audit skipped."
          fi

  codeql:
    name: CodeQL Python Analysis
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Analyze Python code
        uses: github/codeql-action/analyze@v3
